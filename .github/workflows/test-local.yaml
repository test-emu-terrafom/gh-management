name: Test Workflow (Local Testing)
on:
  workflow_dispatch:  # Manual trigger
  pull_request:
    branches: [test, develop]  # Only on test branches
    paths:
      - 'test/**'
      - 'config/test-resources.json'
      - 'modules/**'
      - 'iac/**'

env:
  TF_VERSION: '1.5.0'

jobs:
  validate-test-setup:
    name: Validate Test Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate test JSON structure
        run: |
          # Check test config exists
          if [ ! -f "config/test-resources.json" ]; then
            echo "❌ config/test-resources.json not found"
            exit 1
          fi
          
          # Use existing validation script
          node scripts/validate-json.js config/test-resources.json
      
      - name: Check test files exist
        run: |
          echo "Checking required test files..."
          files=(
            "test/backend.tf"
            "test/terraform.tfvars"
            "test/github-app.pem"
          )
          
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "⚠️ Warning: $file not found (needed for local testing)"
            else
              echo "✓ Found: $file"
            fi
          done

  terraform-test:
    name: Terraform Test (No EMU)
    needs: validate-test-setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Prepare test environment
        run: |
          # Copy test config to main location
          cp config/test-resources.json config/github-resources.json
          
          # Show what we're testing
          echo "🧪 Test Configuration:"
          echo "Teams to create:"
          jq -r '.teams[]' config/github-resources.json | sed 's/^/  - /'
          echo "Repositories to create:"
          jq -r '.repositories[].name' config/github-resources.json | sed 's/^/  - /'
      
      - name: Terraform Init (Local Backend)
        working-directory: ./iac
        run: |
          terraform init -reconfigure \
            -backend-config=../test/backend.tf
      
      - name: Terraform Validate
        working-directory: ./iac
        run: terraform validate
      
      - name: Terraform Plan (Test Mode)
        working-directory: ./iac
        run: |
          terraform plan \
            -var-file=../test/terraform.tfvars \
            -var="enable_emu_features=false" \
            -out=tfplan
      
      - name: Show Plan Summary
        working-directory: ./iac
        run: |
          echo "📋 Plan Summary:"
          terraform show -no-color tfplan | grep -E "will be created|will be destroyed|will be updated" || echo "No changes detected"
      
      # Don't apply in CI - just validate the plan works
      - name: Upload Plan
        uses: actions/upload-artifact@v3
        with:
          name: test-tfplan
          path: iac/tfplan
          retention-days: 1

  test-azure-integration:
    name: Test Azure Integration (Optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'  # Only on manual trigger
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        continue-on-error: true  # Don't fail if Azure creds not set
      
      - name: Test EntraID Group Validation
        shell: pwsh
        run: |
          # This would test if groups exist in Azure AD
          # For local testing, we skip if not configured
          if ($env:AZURE_CLIENT_ID) {
            Write-Host "Testing EntraID group validation..."
            # Would run validation script here
          } else {
            Write-Host "⚠️ Skipping Azure tests - credentials not configured"
          }
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

  summary:
    name: Test Summary
    needs: [validate-test-setup, terraform-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Test Results
        run: |
          echo "## 🧪 Test Workflow Summary"
          echo ""
          echo "This workflow validated:"
          echo "- ✓ Test configuration structure"
          echo "- ✓ Terraform syntax and planning"
          echo "- ✓ Module functionality without EMU"
          echo ""
          echo "### Next Steps for Local Testing:"
          echo "1. Clone this repository"
          echo "2. Set up test/terraform.tfvars with your GitHub App details"
          echo "3. Run: \`cd iac && terraform init -backend-config=../test/backend.tf\`"
          echo "4. Run: \`terraform apply -var-file=../test/terraform.tfvars -var='enable_emu_features=false'\`"
          echo ""
          echo "⚠️ Note: This test workflow does NOT create actual resources"